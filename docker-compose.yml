

services:
  postgres:
    image: postgres:17-alpine
    container_name: logsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logsense
      POSTGRES_USER: logsense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - logsense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsense_user -d logsense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  logsense_postgres_data:
