
services:
  postgres:
    image: postgres:17-alpine
    container_name: logsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logsense
      POSTGRES_USER: logsense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - logsense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsense_user -d logsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: logsense-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: logsense
      POSTGRES_USER: logsense_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sample-app:
    build:
      context: .
      dockerfile: sample-app/Dockerfile
    container_name: logsense-sample-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOGSENSE_BACKEND_URL: http://backend:3000/api/logs
    depends_on:
      backend:
        condition: service_healthy

volumes:
  logsense_postgres_data:
